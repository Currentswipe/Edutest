
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduTest - Student Portal</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fc;color:#172033}
header{background:#155eef;color:white;padding:22px 16px}
header h1{margin:0 0 7px;font-size:27px}
header p{margin:0;opacity:.9}
main{max-width:1000px;margin:auto;padding:15px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
button,.btn{border:0;border-radius:9px;padding:11px 15px;background:#155eef;color:white;font-size:15px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}
.tab{background:#dbe6ff;color:#1746a2}
.tab.active{background:#155eef;color:white}
.card{background:white;border-radius:14px;padding:17px;margin:13px 0;box-shadow:0 3px 14px #0000000b}
.card h3{margin-top:0}
.meta{color:#667085;font-size:14px}
.badge{display:inline-block;background:#e8efff;color:#1746a2;padding:5px 9px;border-radius:20px;font-size:12px;margin:3px 0}
input[type="text"],input[type="search"]{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}
.question{padding:14px 0;border-bottom:1px solid #e4e7ec}
.option{display:block;padding:10px;margin:7px 0;border:1px solid #d0d5dd;border-radius:8px;cursor:pointer}
.option input{margin-right:8px}
.status{padding:12px;border-radius:9px;background:#eff8ff;color:#175cd3;white-space:pre-wrap}
.error{background:#fee4e2;color:#912018}
.result{background:#dcfae6;color:#05603a;padding:15px;border-radius:10px;margin:12px 0}
.hidden{display:none!important}
footer{text-align:center;color:#667085;padding:25px 10px;font-size:13px}
@media(min-width:700px){.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cards .card{margin:0}}
</style>
</head>

<body>
<header>
  <h1>EduTest</h1>
  <p>Study Materials · Online Test Series</p>
</header>

<main>
  <div class="tabs">
    <button id="materialsTab" class="tab active" onclick="showTab('materials')">📚 Study Materials</button>
    <button id="testsTab" class="tab" onclick="showTab('tests')">📝 Test Series</button>
    <button class="tab" onclick="loadData()">↻ Refresh</button>
  </div>

  <div id="notice" class="status">Firebase से data लोड हो रहा है...</div>

  <section id="materialsSection">
    <h2>📚 Study Materials</h2>
    <input type="search" id="materialSearch" placeholder="PDF या subject खोजें..." oninput="renderMaterials()">
    <div id="materialsList" class="cards"></div>
  </section>

  <section id="testsSection" class="hidden">
    <h2>📝 Test Series</h2>
    <input type="search" id="testSearch" placeholder="Test या subject खोजें..." oninput="renderTests()">
    <div id="testsList" class="cards"></div>
  </section>

  <section id="testScreen" class="card hidden">
    <button class="tab" onclick="closeTest()">← वापस</button>
    <h2 id="activeTestTitle"></h2>
    <p id="activeTestInfo" class="meta"></p>
    <div id="testQuestions"></div>
    <button id="submitTestBtn" onclick="submitTest()">Submit Test</button>
    <div id="testResult"></div>
  </section>
</main>

<footer>EduTest Student Portal</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB5vN74NfP-Tx1tIxMDSmOwjhvkgp06Soo",
  authDomain: "edutest-admin.firebaseapp.com",
  databaseURL: "https://edutest-admin-default-rtdb.firebaseio.com",
  projectId: "edutest-admin",
  storageBucket: "edutest-admin.firebasestorage.app",
  messagingSenderId: "785312729550",
  appId: "1:785312729550:web:d9cc16fee38afdc88b839f",
  measurementId: "G-83B1SDVYKF"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let materials = [];
let tests = [];
let currentTest = null;
let submitted = false;

function setNotice(text,isError=false){
  const el=document.getElementById("notice");
  el.textContent=text;
  el.className=isError?"status error":"status";
}

function safeText(value){
  return String(value==null?"":value);
}

function showTab(tab){
  document.getElementById("materialsSection").classList.toggle("hidden",tab!=="materials");
  document.getElementById("testsSection").classList.toggle("hidden",tab!=="tests");
  document.getElementById("testScreen").classList.add("hidden");

  document.getElementById("materialsTab").classList.toggle("active",tab==="materials");
  document.getElementById("testsTab").classList.toggle("active",tab==="tests");
}

async function loadData(){
  setNotice("Firebase से data लोड हो रहा है...");
  try{
    const [materialsSnap,testsSnap]=await Promise.all([
      db.ref("study_materials").once("value"),
      db.ref("tests").once("value")
    ]);

    materials=[];
    tests=[];

    materialsSnap.forEach(child=>{
      const d=child.val()||{};
      if(d.published===true){
        materials.push({id:child.key,...d});
      }
    });

    testsSnap.forEach(child=>{
      const d=child.val()||{};
      if(d.published===true){
        tests.push({id:child.key,...d});
      }
    });

    materials.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    tests.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

    renderMaterials();
    renderTests();
    setNotice("Data लोड हो गया। "+materials.length+
      " PDF और "+tests.length+" published tests मिले।");
  }catch(error){
    setNotice("Data लोड नहीं हुआ: "+error.message+
      "\nRealtime Database Rules में read access नहीं है या database connection में समस्या है।",true);
  }
}

function renderMaterials(){
  const list=document.getElementById("materialsList");
  list.innerHTML="";
  const query=document.getElementById("materialSearch").value.toLowerCase();

  const filtered=materials.filter(m=>
    [m.title,m.subject,m.topic,m.description]
      .some(v=>safeText(v).toLowerCase().includes(query))
  );

  if(!filtered.length){
    list.textContent="कोई published PDF नहीं मिला।";
    return;
  }

  filtered.forEach(m=>{
    const card=document.createElement("article");
    card.className="card";

    const title=document.createElement("h3");
    title.textContent=m.title||"Study Material";

    const subject=document.createElement("span");
    subject.className="badge";
    subject.textContent=m.subject||"General";

    const topic=document.createElement("p");
    topic.className="meta";
    topic.textContent=m.topic||"";

    const description=document.createElement("p");
    description.textContent=m.description||"";

    card.append(title,subject,topic,description);

    if(m.url){
      const link=document.createElement("a");
      link.className="btn";
      link.href=m.url;
      link.target="_blank";
      link.rel="noopener noreferrer";
      link.textContent="Open PDF";
      card.appendChild(link);
    }

    list.appendChild(card);
  });
}

function renderTests(){
  const list=document.getElementById("testsList");
  list.innerHTML="";
  const query=document.getElementById("testSearch").value.toLowerCase();

  const filtered=tests.filter(t=>
    [t.title,t.subject]
      .some(v=>safeText(v).toLowerCase().includes(query))
  );

  if(!filtered.length){
    list.textContent="कोई published test नहीं मिला।";
    return;
  }

  filtered.forEach(t=>{
    const card=document.createElement("article");
    card.className="card";

    const title=document.createElement("h3");
    title.textContent=t.title||"Test Series";

    const subject=document.createElement("p");
    subject.className="meta";
    subject.textContent="Subject: "+(t.subject||"General");

    const info=document.createElement("p");
    info.textContent=(t.totalQuestions||((t.questions||[]).length))+
      " Questions · "+(t.duration||30)+" Minutes · "+
      (t.totalMarks||0)+" Marks";

    const button=document.createElement("button");
    button.textContent="Start Test";
    button.onclick=()=>startTest(t.id);

    card.append(title,subject,info,button);
    list.appendChild(card);
  });
}

function startTest(testId){
  currentTest=tests.find(t=>t.id===testId);
  if(!currentTest)return;

  const questions=Array.isArray(currentTest.questions)
    ? currentTest.questions
    : Object.values(currentTest.questions||{});

  if(!questions.length){
    alert("इस test में questions नहीं हैं।");
    return;
  }

  currentTest._questions=questions;
  submitted=false;

  document.getElementById("materialsSection").classList.add("hidden");
  document.getElementById("testsSection").classList.add("hidden");
  document.getElementById("testScreen").classList.remove("hidden");
  document.getElementById("activeTestTitle").textContent=currentTest.title||"Test";
  document.getElementById("activeTestInfo").textContent=
    "Duration: "+(currentTest.duration||30)+" minutes · Questions: "+questions.length;

  document.getElementById("testResult").innerHTML="";
  document.getElementById("submitTestBtn").classList.remove("hidden");

  const container=document.getElementById("testQuestions");
  container.innerHTML="";

  questions.forEach((q,index)=>{
    const section=document.createElement("div");
    section.className="question";

    const title=document.createElement("h3");
    title.textContent=(index+1)+". "+(q.question||"");

    section.appendChild(title);

    const options=Array.isArray(q.options)?q.options:Object.values(q.options||{});

    options.forEach((option,optIndex)=>{
      const label=document.createElement("label");
      label.className="option";

      const radio=document.createElement("input");
      radio.type="radio";
      radio.name="question_"+index;
      radio.value=String(optIndex);

      label.append(radio,document.createTextNode(" "+safeText(option)));
      section.appendChild(label);
    });

    container.appendChild(section);
  });

  window.scrollTo({top:0,behavior:"smooth"});
}

function submitTest(){
  if(!currentTest||submitted)return;

  const questions=currentTest._questions||[];
  let correct=0,wrong=0,unanswered=0,score=0;

  questions.forEach((q,index)=>{
    const selected=document.querySelector('input[name="question_'+index+'"]:checked');
    const answer=Number(q.correctAnswer);
    const marks=Number(q.marks)||1;

    if(!selected){
      unanswered++;
      return;
    }

    if(Number(selected.value)===answer){
      correct++;
      score+=marks;
    }else{
      wrong++;
      score-=Number(currentTest.negativeMarks)||0;
    }
  });

  submitted=true;

  const result=document.getElementById("testResult");
  result.className="result";
  result.textContent=
    "Test Result\n"+
    "Correct: "+correct+"\n"+
    "Wrong: "+wrong+"\n"+
    "Unanswered: "+unanswered+"\n"+
    "Score: "+Math.max(0,score).toFixed(2)+
    " / "+(currentTest.totalMarks||questions.reduce((s,q)=>s+(Number(q.marks)||1),0));

  document.getElementById("submitTestBtn").classList.add("hidden");

  // Answer explanations shown after submission.
  questions.forEach((q,index)=>{
    const section=document.querySelectorAll(".question")[index];
    const explanation=document.createElement("p");
    explanation.className="meta";

    const answerLetters=["A","B","C","D"];
    explanation.textContent=
      "Correct answer: "+(answerLetters[Number(q.correctAnswer)]||"")+
      (q.explanation?" · "+q.explanation:"");

    section.appendChild(explanation);
  });

  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}

function closeTest(){
  currentTest=null;
  document.getElementById("testScreen").classList.add("hidden");
  document.getElementById("testsSection").classList.remove("hidden");
}

loadData();
</script>
</body>
</html>
