
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduTest Admin Panel</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f5f9;margin:0;padding:16px;color:#172033}
main{max-width:720px;margin:auto}
section{background:white;padding:18px;margin:14px 0;border-radius:14px;box-shadow:0 2px 9px #0001}
input,textarea,select,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border:1px solid #ccd3df;border-radius:8px;font-size:15px}
button{background:#155eef;color:white;border:0;font-weight:bold;cursor:pointer}
h1{font-size:25px}h2{font-size:19px}
.hidden{display:none}.note{font-size:13px;color:#555}
</style>
</head>
<body>
<main>
<h1>EduTest Admin</h1>

<section id="login">
<h2>Admin Login</h2>
<input id="password" type="password" placeholder="Admin password">
<button onclick="loginAdmin()">Login</button>
<p id="loginMsg"></p>
</section>

<div id="panel" class="hidden">
<section>
<h2>📚 Add Study Material / PDF</h2>
<input id="pdfTitle" placeholder="PDF का नाम">
<input id="pdfSubject" placeholder="Subject">
<input id="pdfTopic" placeholder="Topic">
<input id="pdfUrl" type="url" placeholder="Google Drive PDF link">
<textarea id="pdfDesc" placeholder="Description"></textarea>
<label><input id="pdfPublished" type="checkbox" checked style="width:auto"> Publish for students</label>
<button onclick="savePDF()">Save PDF</button>
<p id="pdfMsg"></p>
</section>

<section>
<h2>📝 Add Test Series</h2>
<input id="testTitle" placeholder="Test का नाम">
<input id="testSubject" placeholder="Subject">
<input id="duration" type="number" placeholder="Duration (minutes)">
<div id="questions"></div>
<button onclick="addQuestion()">+ Add Question</button>
<label><input id="testPublished" type="checkbox" checked style="width:auto"> Publish for students</label>
<button onclick="saveTest()">Save Test</button>
<p id="testMsg"></p>
</section>

<section>
<h2>Saved content</h2>
<button onclick="loadContent()">Refresh list</button>
<div id="items"></div>
<button onclick="logoutAdmin()" style="background:#555">Logout</button>
</section>
</div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// Firebase Console > Project settings > Your apps से config भरें.
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "edutest-admin.firebaseapp.com",
  databaseURL: "YOUR_REALTIME_DATABASE_URL",
  projectId: "edutest-admin",
  storageBucket: "edutest-admin.firebasestorage.app",
  messagingSenderId: "785312729550",
  appId: "YOUR_APP_ID"
};

// यह केवल UI password check है, सुरक्षित server authentication नहीं।
const ADMIN_PASSWORD = "79051";

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function loginAdmin(){
  if(document.getElementById("password").value === ADMIN_PASSWORD){
    document.getElementById("login").classList.add("hidden");
    document.getElementById("panel").classList.remove("hidden");
    addQuestion();
    loadContent();
  } else {
    document.getElementById("loginMsg").textContent="गलत पासवर्ड";
  }
}
function logoutAdmin(){
  document.getElementById("panel").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
  document.getElementById("password").value="";
}

function val(id){return document.getElementById(id).value.trim();}
function msg(id,text){document.getElementById(id).textContent=text;}

async function savePDF(){
  const title=val("pdfTitle"),subject=val("pdfSubject"),url=val("pdfUrl");
  if(!title||!subject||!url){msg("pdfMsg","PDF का नाम, subject और Drive link भरें।");return;}
  try{
    const host=new URL(url).hostname;
    if(!["drive.google.com","docs.google.com"].includes(host)){
      throw new Error("Google Drive का सही link डालें।");
    }
    const record={
      title,subject,topic:val("pdfTopic"),url,
      description:val("pdfDesc"),
      published:document.getElementById("pdfPublished").checked,
      createdAt:Date.now()
    };
    await db.ref("study_materials").push(record);
    msg("pdfMsg","PDF रिकॉर्ड सेव हो गया।");
    ["pdfTitle","pdfSubject","pdfTopic","pdfUrl","pdfDesc"].forEach(id=>document.getElementById(id).value="");
    loadContent();
  }catch(e){msg("pdfMsg","Save error: "+e.message);}
}

let questionCount=0;
function addQuestion(){
  const n=++questionCount;
  const div=document.createElement("section");
  div.id="q"+n;
  div.innerHTML=`
    <h3>Question ${n}</h3>
    <textarea class="question" placeholder="प्रश्न लिखें"></textarea>
    <input class="opt" placeholder="Option A">
    <input class="opt" placeholder="Option B">
    <input class="opt" placeholder="Option C">
    <input class="opt" placeholder="Option D">
    <label>सही उत्तर</label>
    <select class="correct">
      <option value="0">A</option><option value="1">B</option>
      <option value="2">C</option><option value="3">D</option>
    </select>
    <input class="marks" type="number" value="1" placeholder="Marks">
    <textarea class="explanation" placeholder="Explanation (optional)"></textarea>
    <button type="button" onclick="this.parentElement.remove()" style="background:#b42318">Remove question</button>`;
  document.getElementById("questions").appendChild(div);
}

async function saveTest(){
  const title=val("testTitle"),subject=val("testSubject");
  const boxes=[...document.querySelectorAll("#questions section")];
  if(!title||!subject||!boxes.length){msg("testMsg","Test का नाम, subject और कम-से-कम एक प्रश्न भरें।");return;}
  const questions=[];
  for(const b of boxes){
    const question=b.querySelector(".question").value.trim();
    const options=[...b.querySelectorAll(".opt")].map(x=>x.value.trim());
    if(!question||options.some(x=>!x)){msg("testMsg","हर प्रश्न और उसके चारों options भरें।");return;}
    questions.push({
      question,options,
      correctAnswer:Number(b.querySelector(".correct").value),
      marks:Number(b.querySelector(".marks").value)||1,
      explanation:b.querySelector(".explanation").value.trim()
    });
  }
  const totalMarks=questions.reduce((sum,q)=>sum+q.marks,0);
  const record={
    title,subject,duration:Number(val("duration"))||30,
    questions,totalQuestions:questions.length,totalMarks,
    published:document.getElementById("testPublished").checked,
    createdAt:Date.now()
  };
  try{
    await db.ref("tests").push(record);
    msg("testMsg","Test Series सेव हो गई।");
    document.getElementById("testTitle").value="";
    document.getElementById("testSubject").value="";
    document.getElementById("duration").value="";
    document.getElementById("questions").innerHTML="";
    questionCount=0;addQuestion();loadContent();
  }catch(e){msg("testMsg","Save error: "+e.message);}
}

async function loadContent(){
  const target=document.getElementById("items");
  target.textContent="Loading...";
  try{
    const [pdfs,tests]=await Promise.all([
      db.ref("study_materials").once("value"),
      db.ref("tests").once("value")
    ]);
    target.innerHTML="";
    function addGroup(snapshot,label,path){
      snapshot.forEach(child=>{
        const data=child.val();
        const row=document.createElement("div");
        row.style.cssText="padding:10px 0;border-bottom:1px solid #ddd";
        const title=document.createElement("strong");
        title.textContent=label+": "+(data.title||"Untitled");
        const status=document.createElement("span");
        status.textContent=data.published?" — Published":" — Draft";
        const del=document.createElement("button");
        del.textContent="Delete";
        del.style.background="#b42318";
        del.onclick=async()=>{
          if(confirm("क्या इसे delete करना है?")){
            try{await db.ref(path+"/"+child.key).remove();loadContent();}
            catch(e){alert("Delete error: "+e.message);}
          }
        };
        row.append(title,status,del);target.appendChild(row);
      });
    }
    addGroup(pdfs,"PDF","study_materials");
    addGroup(tests,"Test","tests");
    if(!target.children.length)target.textContent="अभी कोई रिकॉर्ड नहीं है।";
  }catch(e){target.textContent="Load error: "+e.message;}
}
</script>
</body>
</html>
