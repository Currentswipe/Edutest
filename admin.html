<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduApp Admin</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
function showErr(m){var d=document.getElementById('errbar');if(!d){d=document.createElement('div');d.id='errbar';d.style.cssText='position:fixed;left:0;right:0;bottom:0;background:#b91c1c;color:#fff;padding:10px;font:13px sans-serif;z-index:99999;white-space:pre-wrap';document.body.appendChild(d)}d.textContent='Error: '+m}
window.addEventListener('error',function(e){showErr(e.message)});
window.addEventListener('unhandledrejection',function(e){showErr((e.reason&&e.reason.message)||String(e.reason))});
</script>
</head>
<body class="bg-slate-50 text-slate-900"><div id="app"><p style="padding:20px;font-family:sans-serif">Loading…</p></div>
<script>
if(typeof firebase==='undefined')throw new Error('Firebase library load nahi hui. Internet ya ad-blocker check karo.');
firebase.initializeApp({apiKey:"AIzaSyB5vN74NfP-Tx1tIxMDSmOwjhvkgp06Soo",authDomain:"edutest-admin.firebaseapp.com",projectId:"edutest-admin",storageBucket:"edutest-admin.firebasestorage.app",appId:"1:785312729550:web:d9cc16fee38afdc88b839f"});
const auth=firebase.auth(),db=firebase.firestore(),st=firebase.storage(),root=document.getElementById('app');
const $=i=>document.getElementById(i),v=i=>$(i).value;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn='rounded-lg bg-indigo-600 px-4 py-2 text-white font-medium',inp='w-full rounded-lg border p-2',card='bg-white p-4 rounded-xl shadow';
let me=null,tab='dash',U=[],MT=[],TT=[];
const log=(action,target)=>db.collection('audit').add({by:me.id,action,target:String(target),at:Date.now()}).catch(()=>{});

auth.onAuthStateChanged(async u=>{
  try{
    if(!u){me=null;return loginView()}
    const d=await db.collection('users').doc(u.uid).get();
    if(!d.exists||d.data().role!=='admin'){await auth.signOut();alert('Not an admin account');return}
    me={id:u.uid,...d.data()};go('dash');
  }catch(e){showErr(e.message);loginView()}
});
function loginView(){
  root.innerHTML=`<div class="mx-auto max-w-sm p-6 pt-16"><h1 class="text-2xl font-bold text-indigo-600 mb-4">Admin Login</h1><div class="${card} space-y-3">
  <input id=em class="${inp}" placeholder="Admin email"><input id=pw type=password class="${inp}" placeholder="Password">
  <p id=err class="text-sm text-red-600"></p><button onclick="login()" class="${btn} w-full">Login</button></div></div>`;
}
async function login(){try{await auth.signInWithEmailAndPassword(v('em').trim(),v('pw'))}catch(e){$('err').textContent='Incorrect credentials'}}

const tabs=[['dash','Dashboard'],['stu','Students'],['con','Content'],['tst','Tests']];
function go(t){tab=t;shell('<p>Loading…</p>');({dash,stu,con,tst})[t]().catch(e=>showErr(e.message))}
function shell(h){root.innerHTML=`<div class="min-h-screen pb-16 md:pb-0"><header class="sticky top-0 z-10 bg-white border-b flex items-center justify-between px-4 py-3"><b class="text-indigo-600">Admin Panel</b>
<nav class="hidden md:flex gap-2">${tabs.map(([k,l])=>`<button onclick="go('${k}')" class="px-3 py-1 rounded ${k==tab?'bg-indigo-600 text-white':''}">${l}</button>`).join('')}</nav>
<button onclick="auth.signOut()" class="text-sm text-slate-600">Logout</button></header><main class="mx-auto max-w-4xl p-4">${h}</main>
<nav class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t flex justify-around py-3 text-xs">${tabs.map(([k,l])=>`<button onclick="go('${k}')" class="px-2 ${k==tab?'text-indigo-600 font-bold':'text-slate-500'}">${l}</button>`).join('')}</nav></div>`}

async function dash(){
  const [u,m,t,a,l]=await Promise.all(['users','materials','tests','attempts'].map(c=>db.collection(c).get()).concat(db.collection('audit').orderBy('at','desc').limit(8).get()));
  const us=u.docs.map(d=>d.data()).filter(x=>x.role!=='admin'),now=Date.now();
  const prem=us.filter(x=>x.premium&&(!x.expiry||x.expiry>now)).length;
  const avg=a.size?a.docs.reduce((s,d)=>s+d.data().pct,0)/a.size:0;
  shell(`<div class="grid grid-cols-2 md:grid-cols-4 gap-3">${[['Students',us.length],['Premium',prem],['Free',us.length-prem],['Suspended/Locked',us.filter(x=>x.status!=='active').length],['PDFs',m.size],['Tests',t.size],['Attempts',a.size],['Avg score',avg.toFixed(1)+'%']].map(([k,x])=>`<div class="${card}"><p class="text-xs text-slate-500">${k}</p><p class="text-xl font-bold">${x}</p></div>`).join('')}</div>
  <h3 class="mt-5 mb-2 font-semibold">Recent admin activity</h3>${l.docs.map(d=>{const x=d.data();return `<div class="bg-white p-2 rounded mb-1 text-sm">${esc(x.action)} · ${esc(x.target)} · ${new Date(x.at).toLocaleString()}</div>`}).join('')||'<p class="text-slate-500">None yet.</p>'}`);
}

/* ---------- STUDENTS ---------- */
async function stu(){
  U=(await db.collection('users').limit(500).get()).docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.role!=='admin');
  shell(`<input id=sq class="${inp} mb-3" placeholder="Search name, username, mobile, ID" oninput="drawStu()"><div id=sl></div>`);drawStu();
}
function drawStu(){
  const q=v('sq').toLowerCase();
  $('sl').innerHTML=U.filter(x=>[x.name,x.username,x.mobile,x.sid].join(' ').toLowerCase().includes(q)).map(x=>{
    const p=x.premium&&(!x.expiry||x.expiry>Date.now());
    return `<div class="${card} mb-2 text-sm"><b>${esc(x.name)}</b> <span class="text-slate-500">${esc(x.sid)} · @${esc(x.username)} · ${esc(x.mobile)}</span>
    <p>Plan: ${p?'Premium'+(x.expiry?' till '+new Date(x.expiry).toLocaleDateString():' (permanent)'):'Free'} · Status: ${esc(x.status)} · Joined ${new Date(x.createdAt).toLocaleDateString()}</p>
    <div class="mt-2 flex gap-2 flex-wrap"><button onclick="togPrem('${x.id}')" class="px-3 py-1 border rounded">${p?'Revoke Premium':'Grant Premium'}</button>
    <button onclick="setStatus('${x.id}','${x.status==='active'?'suspended':'active'}')" class="px-3 py-1 border rounded">${x.status==='active'?'Suspend':'Reactivate'}</button>
    <button onclick="setStatus('${x.id}','${x.status==='locked'?'active':'locked'}')" class="px-3 py-1 border rounded">${x.status==='locked'?'Unlock':'Lock'}</button></div></div>`}).join('')||'<p class="text-slate-500">No students.</p>';
}
async function togPrem(id){
  const x=U.find(u=>u.id==id),p=x.premium&&(!x.expiry||x.expiry>Date.now());let upd;
  if(p){if(!confirm('Revoke premium?'))return;upd={premium:false,expiry:null}}
  else{const d=prompt('Premium days (leave blank for permanent):');if(d===null)return;upd={premium:true,expiry:d.trim()?Date.now()+(+d)*864e5:null}}
  const reason=prompt('Reason (recorded in audit log):')||'';
  await db.collection('users').doc(id).update(upd);log((p?'revoke':'grant')+' premium '+reason,x.username);stu();
}
async function setStatus(id,s){
  const x=U.find(u=>u.id==id);if(!confirm('Set '+x.username+' to '+s+'?'))return;
  await db.collection('users').doc(id).update({status:s});log('status '+s,x.username);stu();
}

/* ---------- CONTENT ---------- */
async function con(){
  MT=(await db.collection('materials').get()).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.createdAt-a.createdAt);
  shell(`<div class="${card} space-y-2"><h3 class="font-semibold">Upload PDF</h3>
  <input id=sj class="${inp}" placeholder="Subject"><input id=tp class="${inp}" placeholder="Topic"><input id=ti class="${inp}" placeholder="PDF title">
  <input id=fl type=file accept="application/pdf"><label class="block text-sm"><input id=pr type=checkbox> Premium only</label>
  <button onclick="upload()" class="${btn}">Upload</button><p id=pg class="text-sm"></p></div>
  <h3 class="mt-5 mb-2 font-semibold">All PDFs (${MT.length})</h3>
  ${MT.map(x=>`<div class="bg-white p-3 rounded-lg mb-2 text-sm flex justify-between gap-2"><span><b>${esc(x.title)}</b> ${x.premium?'👑':''}<br><span class="text-slate-500">${esc(x.subject)} › ${esc(x.topic)} · ${(x.size/1048576).toFixed(1)} MB</span></span><button onclick="delMat('${x.id}')" class="text-red-600">Delete</button></div>`).join('')}`);
}
function upload(){
  const f=$('fl').files[0],s=v('sj').trim(),t=v('tp').trim(),ti=v('ti').trim();
  if(!f||!s||!t||!ti)return alert('Fill all fields and choose a PDF');
  if(f.type!=='application/pdf'||f.size>20*1048576)return alert('PDF only, max 20 MB');
  const path='pdfs/'+Date.now()+'_'+f.name.replace(/[^\w.]/g,'_'),task=st.ref(path).put(f);
  task.on('state_changed',x=>$('pg').textContent='Uploading '+Math.round(x.bytesTransferred/x.totalBytes*100)+'%',e=>alert(e.message),async()=>{
    const url=await task.snapshot.ref.getDownloadURL();
    await db.collection('materials').add({subject:s,topic:t,title:ti,url,path,size:f.size,premium:$('pr').checked,createdAt:Date.now()});
    log('upload pdf',ti);con();
  });
}
async function delMat(id){
  const x=MT.find(m=>m.id==id);if(!confirm('Delete "'+x.title+'"?'))return;
  await db.collection('materials').doc(id).delete();st.ref(x.path).delete().catch(()=>{});log('delete pdf',x.title);con();
}

/* ---------- TESTS ---------- */
async function tst(){
  TT=(await db.collection('tests').get()).docs.map(d=>({id:d.id,...d.data()}));
  shell(`<div class="${card} space-y-2"><h3 class="font-semibold">Create test</h3>
  <input id=tt class="${inp}" placeholder="Test title"><input id=ts class="${inp}" placeholder="Subject / topic">
  <div class="grid grid-cols-3 gap-2"><input id=td type=number class="${inp}" placeholder="Minutes"><input id=tm type=number class="${inp}" placeholder="Marks/Q"><input id=tn type=number step=0.01 class="${inp}" placeholder="Negative"></div>
  <label class="block text-sm"><input id=tpm type=checkbox> Premium only</label>
  <textarea id=tq rows=7 class="${inp}" placeholder="One question per line:&#10;Question | Option A | Option B | Option C | Option D | CorrectNumber(1-4) | Explanation (optional)"></textarea>
  <button onclick="saveTest()" class="${btn}">Save &amp; publish</button></div>
  <h3 class="mt-5 mb-2 font-semibold">All tests (${TT.length})</h3>
  ${TT.map(t=>`<div class="bg-white p-3 rounded-lg mb-2 text-sm"><b>${esc(t.title)}</b> ${t.premium?'👑':''} · ${t.questions.length} Qs · ${t.published?'Published':'Draft'}
  <div class="mt-1 flex gap-3"><button onclick="pubTest('${t.id}',${!t.published})" class="text-indigo-600">${t.published?'Unpublish':'Publish'}</button><button onclick="delTest('${t.id}')" class="text-red-600">Delete</button></div></div>`).join('')}`);
}
async function saveTest(){
  try{
    const title=v('tt').trim(),subject=v('ts').trim(),duration=+v('td'),marks=+v('tm'),neg=+v('tn')||0;
    if(!title||!subject||!(duration>0)||!(marks>0))throw Error('Fill title, subject, minutes and marks');
    const questions=v('tq').split('\n').map(l=>l.trim()).filter(Boolean).map((l,i)=>{
      const p=l.split('|').map(x=>x.trim()),ans=+p[5]-1;
      if(p.length<6||p.slice(0,5).some(x=>!x)||!(ans>=0&&ans<4))throw Error('Line '+(i+1)+' is invalid (needs question, 4 options, answer 1-4)');
      return {q:p[0],o:p.slice(1,5),ans,exp:p[6]||''};
    });
    if(!questions.length)throw Error('Add at least one question');
    await db.collection('tests').add({title,subject,duration,marks,neg,premium:$('tpm').checked,questions,published:true,createdAt:Date.now()});
    log('create test',title);tst();
  }catch(e){alert(e.message)}
}
async function pubTest(id,p){await db.collection('tests').doc(id).update({published:p});log(p?'publish test':'unpublish test',id);tst()}
async function delTest(id){if(!confirm('Delete this test? Past results are kept.'))return;await db.collection('tests').doc(id).delete();log('delete test',id);tst()}
</script></body></html>
