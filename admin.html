
<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduPath Admin Panel</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">
<main class="max-w-5xl mx-auto p-4 sm:p-8">
  <section id="login" class="bg-white rounded-2xl p-6 max-w-md mx-auto mt-12 shadow">
    <h1 class="text-2xl font-black text-indigo-700">EduPath Admin</h1>
    <p class="text-sm text-slate-500 mt-2">Admin password दर्ज करें।</p>
    <form id="loginForm">
      <input id="password" type="password" class="border rounded-xl p-3 w-full mt-4" placeholder="Admin Password" required>
      <button class="bg-indigo-600 text-white rounded-xl p-3 w-full mt-3 font-bold">Login</button>
    </form>
    <p id="loginMsg" class="text-red-600 text-sm mt-3"></p>
    <p class="text-xs text-slate-500 mt-4">यह पासवर्ड स्क्रीन अकेले Firebase की सुरक्षा नहीं करती। नीचे नोट देखें।</p>
  </section>

  <section id="panel" class="hidden">
    <header class="flex flex-wrap justify-between items-center gap-3 mb-6">
      <div><h1 class="text-3xl font-black text-indigo-700">EduPath Admin</h1><p class="text-slate-500">Study Material और Test Management</p></div>
      <button id="logout" class="bg-slate-700 text-white rounded-lg px-4 py-2">Logout</button>
    </header>

    <div class="grid sm:grid-cols-2 gap-4 mb-6">
      <div class="bg-white rounded-2xl p-5 shadow-sm"><div class="text-slate-500">Study Materials</div><div id="materialCount" class="text-3xl font-black">0</div></div>
      <div class="bg-white rounded-2xl p-5 shadow-sm"><div class="text-slate-500">Tests</div><div id="testCount" class="text-3xl font-black">0</div></div>
    </div>

    <div class="bg-white rounded-2xl p-5 mb-6">
      <h2 class="text-xl font-bold mb-4">Study Material जोड़ें / अपडेट करें</h2>
      <form id="materialForm" class="grid sm:grid-cols-2 gap-3">
        <input id="mid" type="hidden">
        <input id="title" class="border rounded-lg p-3" placeholder="Material का नाम" required>
        <input id="subject" class="border rounded-lg p-3" placeholder="Subject" required>
        <input id="topic" class="border rounded-lg p-3" placeholder="Topic">
        <input id="fileUrl" type="url" class="border rounded-lg p-3" placeholder="Google Drive PDF Link" required>
        <textarea id="description" class="border rounded-lg p-3 sm:col-span-2" placeholder="Description"></textarea>
        <label class="flex gap-2 items-center"><input id="premium" type="checkbox"> Premium material</label>
        <label class="flex gap-2 items-center"><input id="published" type="checkbox" checked> Publish to students</label>
        <div class="sm:col-span-2 flex flex-wrap gap-2">
          <button class="bg-indigo-600 text-white rounded-lg px-5 py-3 font-bold">Save Material</button>
          <button type="button" id="clearMaterial" class="bg-slate-200 rounded-lg px-5 py-3">Clear</button>
        </div>
      </form>
    </div>

    <div class="bg-white rounded-2xl p-5 mb-6">
      <h2 class="text-xl font-bold mb-4">Materials की सूची</h2>
      <div id="materials" class="space-y-3"></div>
    </div>

    <div class="bg-white rounded-2xl p-5 mb-6">
      <h2 class="text-xl font-bold mb-4">MCQ Test बनाएं</h2>
      <form id="testForm" class="space-y-3">
        <input id="testTitle" class="border rounded-lg p-3 w-full" placeholder="Test का नाम" required>
        <input id="testSubject" class="border rounded-lg p-3 w-full" placeholder="Subject" required>
        <div class="grid sm:grid-cols-3 gap-3">
          <input id="duration" type="number" min="1" value="15" class="border rounded-lg p-3" placeholder="Minutes">
          <input id="marks" type="number" min="1" value="1" class="border rounded-lg p-3" placeholder="Marks/question">
          <input id="negative" type="number" min="0" step="0.25" value="0" class="border rounded-lg p-3" placeholder="Negative marks">
        </div>
        <div id="questions" class="space-y-4"></div>
        <button type="button" id="addQuestion" class="bg-slate-200 rounded-lg px-4 py-2">+ Add Question</button>
        <label class="flex gap-2 items-center"><input id="testPublished" type="checkbox" checked> Publish test</label>
        <button class="bg-indigo-600 text-white rounded-lg p-3 w-full font-bold">Save Test</button>
      </form>
    </div>

    <div class="bg-white rounded-2xl p-5">
      <h2 class="text-xl font-bold mb-4">Test सूची</h2>
      <div id="tests" class="space-y-3"></div>
    </div>
    <p id="status" class="mt-5 text-sm whitespace-pre-wrap"></p>
  </section>
</main>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB5vN74NfP-Tx1tIxMDSmOwjhvkgp06Soo",
  authDomain: "edutest-admin.firebaseapp.com",
  projectId: "edutest-admin",
  storageBucket: "edutest-admin.firebasestorage.app",
  messagingSenderId: "785312729550",
  appId: "1:785312729550:web:d9cc16fee38afdc88b839f",
  measurementId: "G-83B1SDVYKF"
};

// यह पासवर्ड ब्राउज़र के source code में देखा जा सकता है।
const ADMIN_PASSWORD = "79051";

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let materials = [], tests = [];

const $ = id => document.getElementById(id);
const say = text => $("status").textContent = text;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  if ($("password").value !== ADMIN_PASSWORD) {
    $("loginMsg").textContent = "गलत पासवर्ड।";
    return;
  }
  $("loginMsg").textContent =
    "पासवर्ड सही है, लेकिन Firebase में सुरक्षित admin authentication भी जरूरी है।";
  // केवल password match होने से Firestore write permission नहीं मिलती।
});

$("logout").onclick = () => {
  $("panel").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("password").value = "";
};

function resetMaterial() {
  $("materialForm").reset();
  $("mid").value = "";
  $("published").checked = true;
}
$("clearMaterial").onclick = resetMaterial;

function driveUrlValid(value) {
  try {
    const u = new URL(value);
    return u.protocol === "https:" &&
      ["drive.google.com","docs.google.com"].includes(u.hostname);
  } catch { return false; }
}

$("materialForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (!auth.currentUser) {
    say("Firestore में सेव करने के लिए Firebase Admin Authentication आवश्यक है।");
    return;
  }
  const url = $("fileUrl").value.trim();
  if (!driveUrlValid(url)) {
    say("सही Google Drive PDF लिंक डालें।");
    return;
  }
  const data = {
    title: $("title").value.trim(),
    subject: $("subject").value.trim(),
    topic: $("topic").value.trim(),
    description: $("description").value.trim(),
    fileUrl: url,
    premium: $("premium").checked,
    published: $("published").checked,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  try {
    if ($("mid").value) {
      await db.collection("study_materials").doc($("mid").value).update(data);
    } else {
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection("study_materials").add(data);
    }
    say("Material सेव हो गया।");
    resetMaterial();
    await loadContent();
  } catch (err) {
    say("Save नहीं हुआ: " + err.message);
  }
});

function editMaterial(id) {
  const m = materials.find(x => x.id === id);
  if (!m) return;
  $("mid").value = id;
  $("title").value = m.title || "";
  $("subject").value = m.subject || "";
  $("topic").value = m.topic || "";
  $("fileUrl").value = m.fileUrl || "";
  $("description").value = m.description || "";
  $("premium").checked = !!m.premium;
  $("published").checked = !!m.published;
  window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteMaterial(id) {
  if (!confirm("इस material को हटाएँ?")) return;
  try {
    await db.collection("study_materials").doc(id).delete();
    await loadContent();
    say("Material हटा दिया गया।");
  } catch (e) { say("Delete नहीं हुआ: " + e.message); }
}

function renderMaterials() {
  $("materialCount").textContent = materials.length;
  $("materials").innerHTML = materials.map(m => `
    <article class="border rounded-xl p-4">
      <div class="font-bold">${esc(m.title)}</div>
      <div class="text-sm text-slate-500">${esc(m.subject)} · ${esc(m.topic)}</div>
      <div class="text-xs mt-1">${m.published ? "Published" : "Draft"} · ${m.premium ? "Premium" : "Free"}</div>
      <div class="flex flex-wrap gap-2 mt-3">
        <button class="bg-indigo-100 text-indigo-700 rounded-lg px-3 py-2" onclick="editMaterial('${m.id}')">Edit</button>
        <a class="bg-slate-100 rounded-lg px-3 py-2" target="_blank" rel="noopener" href="${esc(m.fileUrl)}">Open PDF</a>
        <button class="bg-red-100 text-red-700 rounded-lg px-3 py-2" onclick="deleteMaterial('${m.id}')">Delete</button>
      </div>
    </article>`).join("") || "<p>अभी कोई सामग्री नहीं है।</p>";
}

function addQuestion() {
  const n = $("questions").children.length;
  const div = document.createElement("div");
  div.className = "border rounded-xl p-4 space-y-2";
  div.innerHTML = `
    <div class="flex justify-between"><b>Question ${n+1}</b>
    <button type="button" class="text-red-600" onclick="this.closest('.border').remove()">Remove</button></div>
    <input class="qtext border rounded-lg p-3 w-full" placeholder="Question" required>
    <div class="grid sm:grid-cols-2 gap-2">
      <input class="qopt border rounded-lg p-3" placeholder="Option A" required>
      <input class="qopt border rounded-lg p-3" placeholder="Option B" required>
      <input class="qopt border rounded-lg p-3" placeholder="Option C" required>
      <input class="qopt border rounded-lg p-3" placeholder="Option D" required>
    </div>
    <label class="text-sm">Correct answer
      <select class="qcorrect border rounded-lg p-2 ml-2">
        <option value="0">A</option><option value="1">B</option>
        <option value="2">C</option><option value="3">D</option>
      </select>
    </label>`;
  $("questions").appendChild(div);
}
$("addQuestion").onclick = addQuestion;
addQuestion();

$("testForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (!auth.currentUser) {
    say("Test सेव करने के लिए Firebase Admin Authentication आवश्यक है।");
    return;
  }
  const questionBlocks = [...$("questions").children];
  const questions = questionBlocks.map(b => ({
    text: b.querySelector(".qtext").value.trim(),
    options: [...b.querySelectorAll(".qopt")].map(x => x.value.trim()),
    correctIndex: Number(b.querySelector(".qcorrect").value)
  }));
  if (!questions.length || questions.some(q => !q.text || q.options.some(o => !o))) {
    say("हर प्रश्न और उसके चारों विकल्प भरें।");
    return;
  }
  const data = {
    title: $("testTitle").value.trim(),
    subject: $("testSubject").value.trim(),
    durationMinutes: Number($("duration").value) || 15,
    marksPerQuestion: Number($("marks").value) || 1,
    negativeMarks: Number($("negative").value) || 0,
    questions,
    published: $("testPublished").checked,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  try {
    data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
    await db.collection("tests").add(data);
    $("testForm").reset();
    $("questions").innerHTML = "";
    addQuestion();
    await loadContent();
    say("Test सेव हो गया।");
  } catch (err) { say("Test सेव नहीं हुआ: " + err.message); }
});

async function deleteTest(id) {
  if (!confirm("यह test हटाएँ?")) return;
  try {
    await db.collection("tests").doc(id).delete();
    await loadContent();
    say("Test हटा दिया गया।");
  } catch (e) { say("Delete नहीं हुआ: " + e.message); }
}

function renderTests() {
  $("testCount").textContent = tests.length;
  $("tests").innerHTML = tests.map(t => `
    <article class="border rounded-xl p-4">
      <b>${esc(t.title)}</b>
      <div class="text-sm text-slate-500">${esc(t.subject)} · ${(t.questions||[]).length} questions</div>
      <div class="text-xs mt-1">${t.published ? "Published" : "Draft"}</div>
      <button class="bg-red-100 text-red-700 rounded-lg px-3 py-2 mt-3" onclick="deleteTest('${t.id}')">Delete</button>
    </article>`).join("") || "<p>अभी कोई test नहीं है।</p>";
}

async function loadContent() {
  try {
    const [m,t] = await Promise.all([
      db.collection("study_materials").get(),
      db.collection("tests").get()
    ]);
    materials = m.docs.map(d => ({id:d.id,...d.data()}));
    tests = t.docs.map(d => ({id:d.id,...d.data()}));
    renderMaterials();
    renderTests();
  } catch (e) {
    say("Firebase permission error: " + e.message);
  }
}
</script>
</body>
</html>
